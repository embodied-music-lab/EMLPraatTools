# ============================================================================
# EML Stats & Graphs — validation suite
#
# Ian Howell — Embodied Music Lab — GPL-3.0-or-later
#
# Runs `Rscript validate/run_all.R` on every push and every pull request. The
# suite exits 1 if any check fails and GitHub runs each `run:` block under
# `bash -e`, so a nonzero exit fails the step and the job. Nothing here needs
# a secret or a token.
#
# WHAT THE SUITE ACTUALLY NEEDS, AND WHY THIS IS NOT JUST `setup-r`
#
# README.md and validate/README.md both say the suite needs "R and nothing
# else" — "no Praat, no packages, no network". The first half is true and the
# second half is not, measured on 16 August 2026 against Praat 6.6.30 and
# R 4.3.3:
#
#   * NO PACKAGES is true. Nothing outside base R is loaded. v17 uses broom
#     when broom happens to be installed and falls back to base R when it is
#     not, saying which mode it ran in; that is the only optional package.
#
#   * NO PRAAT IS FALSE. Seven validators — v59, v63, v64, v65, v70, v71,
#     v77 — resolve a Praat binary and drive it, and each of them FAILS the
#     check "a Praat at or above the plugin's floor is available" when there
#     is none. With no Praat on PATH, v59 goes from 42 checks all passing to
#     6 checks with 1 FAILED, and the suite exits 1. A job that installed
#     only R would be red on its first run and stay red.
#
#   * THE BARREN EDITION IS NOT ENOUGH either. praat6630_linux-x64v3-barren
#     runs the arithmetic but presents no dialogs, and v59's subject is that
#     every registered menu and action command reaches its form: 28 of its 42
#     checks fail against barren and none fail against the full build. So the
#     full Linux build is what goes on PATH.
#
#   * python3 AND unzip ARE NEEDED TOO. v78 runs the two static checkers,
#     which are python; v79 builds the release artefact with the python
#     builder and unpacks the zip it produces under `umask 077` to measure
#     the modes that land on disk. Both are on the runner image; both are
#     checked below rather than assumed, because a missing interpreter is
#     exactly the state in which a check quietly stops being a check.
#
#   * NETWORK: the suite itself makes no network call. This job does, once,
#     to fetch that Praat build — there is no other way to get 6.6.30 onto a
#     runner.
#
# Ubuntu 24.04 ships praat 6.4.06, which is below the plugin's 6.6.30 floor
# and is REFUSED by the validators rather than warned about (harness/_env.sh
# explains why: a green suite on an unsupported build is not evidence). The
# package is installed anyway, for its shared-library closure — libgtk-3-0t64,
# libcairo2, libpango, libasound2t64, libpulse0 — which is exactly what the
# downloaded binary links against, and installing it by name is shorter and
# ages better than listing the libraries. The 6.6.30 binary then goes in
# /usr/local/bin, which precedes /usr/bin on PATH, so it is the one that
# resolves.
#
# r-base-core on 24.04 is 4.3.3 — the version validate/README.md names.
#
# WHY EVERY STEP BELOW CHECKS ITSELF
#
# The first and only run of this workflow FAILED IN 27 SECONDS. That number
# is the diagnosis. Checkout of this tree is a handful of seconds,
# `apt-get update` on a runner is ten to twenty, and an apt install of
# r-base-core plus praat is sixty seconds at the very least — forty-odd
# packages fetched, unpacked and configured. Twenty-seven seconds is not
# enough for that install to have SUCCEEDED, and it is far too early for the
# 62 MB Praat download, the version prints, or the suite (12,400 checks) to
# have been reached at all. So the job died inside the apt step, at
# RESOLUTION: `E: Unable to locate package` is printed within a second or two
# of the install starting, and checkout + update + a fast refusal is 27
# seconds almost exactly.
#
# BOTH `r-base-core` AND `praat` LIVE IN THE `universe` COMPONENT, so a runner
# image without universe enabled cannot resolve either of them, and one line
# of apt output would have named both. Universe is therefore enabled
# EXPLICITLY below rather than hoped for, and each package is looked up with
# `apt-cache policy` before the install, so "this package is in no enabled
# repository" is reported by name instead of arriving as apt's generic error.
#
# THE OTHER OPEN QUESTION WAS NOT WHAT FAILED, AND STILL HAS TO BE ANSWERED.
# The only Linux x64 build Praat publishes is `x64v3` — the x86-64-v3
# microarchitecture level, which requires AVX2 — and whether the runner's CPU
# provides it could not be verified when this file was written. It cannot
# have caused a 27-second failure, because the download step runs after the
# apt step and the apt step never finished. But if that CPU lacked AVX2 the
# binary would die of an illegal instruction, and the failure would surface
# much later and wearing the wrong clothes: seven validators reporting "no
# Praat at or above the plugin's floor". So the flag is checked before the
# download, and the downloaded binary is required to PRINT ITS VERSION before
# the suite is allowed to start.
#
# Every step below therefore fails loudly and by name. Nothing is allowed to
# be absent quietly.
# ============================================================================

name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Rscript validate/run_all.R
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Enable universe, where both r-base-core and praat live
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          for pkg in r-base-core praat; do
            if ! apt-cache policy "$pkg" | grep -q 'Candidate: [^(]'; then
              echo "SETUP FAILED: apt has no candidate for '$pkg'." >&2
              echo "The universe component is not reachable on this runner." >&2
              apt-cache policy "$pkg" >&2
              exit 1
            fi
          done

      - name: Install R, and Praat 6.4 for its library dependencies
        run: |
          # libjack-jackd2-0 IS NAMED HERE ON PURPOSE. Praat's own Linux
          # binary links against libjack.so.0, but Ubuntu's praat package
          # only RECOMMENDS the JACK library rather than depending on it, and
          # --no-install-recommends skips it. The package install then
          # succeeds, the binary lands, and Praat refuses to start with
          # "libjack.so.0: cannot open shared object file".
          sudo apt-get install -y --no-install-recommends \
            r-base-core praat libjack-jackd2-0
          for tool in Rscript praat python3 unzip; do
            if ! command -v "$tool" > /dev/null; then
              echo "SETUP FAILED: '$tool' is not on PATH after the install." >&2
              exit 1
            fi
            echo "found $tool at $(command -v "$tool")"
          done
          Rscript -e 'cat("R is runnable:", R.version.string, "\n")'

      # The only Linux x64 build Praat publishes is x86-64-v3, whose marker
      # instruction set is AVX2. A runner without it would install a binary
      # that dies of SIGILL, and the seven validators that drive Praat would
      # report "no Praat at or above the floor" — true, and nothing like the
      # actual cause.
      - name: Check this runner can run an x86-64-v3 binary
        run: |
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          if ! grep -qm1 ' avx2 ' /proc/cpuinfo; then
            echo "SETUP FAILED: this runner's CPU reports no avx2 flag." >&2
            echo "praat6630_linux-x64v3 is the only Linux x64 build Praat" >&2
            echo "publishes and it requires x86-64-v3. Nothing here can run it." >&2
            exit 1
          fi

      - name: Install Praat 6.6.30, the plugin's supported floor
        run: |
          curl -fsSL -o praat.tar.gz \
            https://github.com/praat/praat/releases/download/v6.6.30/praat6630_linux-x64v3.tar.gz
          sudo tar xzf praat.tar.gz -C /usr/local/bin praat
          rm praat.tar.gz
          if [ ! -x /usr/local/bin/praat ]; then
            echo "SETUP FAILED: the tarball produced no /usr/local/bin/praat." >&2
            exit 1
          fi

      # Printed before the suite so a failing run says what it ran on, and
      # ASSERTED as well as printed: the validators refuse a Praat below
      # 6.6.30, so a 6.4.06 here would mean the download step silently did
      # nothing, and 12,400 checks is a long way to walk to find that out.
      - name: What this ran on
        run: |
          command -v praat
          if ! praat --version; then
            echo "SETUP FAILED: the downloaded praat did not run." >&2
            echo "An illegal-instruction exit here means the runner's CPU is" >&2
            echo "below x86-64-v3; anything else, read the line above." >&2
            exit 1
          fi
          if ! praat --version | grep -q '6\.6\.30'; then
            echo "SETUP FAILED: praat on PATH is $(praat --version)," >&2
            echo "not the 6.6.30 this job installed. /usr/local/bin is not" >&2
            echo "ahead of /usr/bin on this image." >&2
            exit 1
          fi
          Rscript -e 'cat(R.version.string, "\n")'
          python3 --version
          unzip -v | head -1

      - name: Run the validation suite
        run: Rscript validate/run_all.R
